name: CI and container build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q api tests
      - name: Run API tests
        # Use module invocation so the repository root is on sys.path.
        run: python -m pytest -q tests/unit
      - name: Build OCI image (no push)
        run: docker build -t openweight-llm:ci .
